description: |-
  内閣官房のウェブサイト（www.cas.go.jp）が公開する資料のデータセットです。行政事業レビューのシートが関係する計画・通知等として挙げる内閣官房のサイトの PDF を、ページごとの本文で持ちます（plans）。首相官邸のサイトから移転した会議の資料も含みます。毎月、シートの URL を取り直します。

  出典：行政事業レビュー見える化サイト（https://rssystem.go.jp）、内閣官房ウェブサイト（https://www.cas.go.jp/）の各資料を加工して作成
