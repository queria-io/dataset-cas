# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
name: cas
title: 内閣官房
description: |-
  内閣官房のウェブサイト（www.cas.go.jp）が公開する資料のデータセットです。行政事業レビューのシートが関係する計画・通知等として挙げる内閣官房のサイトの PDF を、ページごとの本文で持ちます（plans）。毎月、シートの URL を取り直します。

  出典：行政事業レビュー見える化サイト（https://rssystem.go.jp）、内閣官房ウェブサイト（https://www.cas.go.jp/）の各資料を加工して作成
keywords:
  - 内閣官房
  - 行政事業レビュー
  - 計画・通知等
homepage: https://github.com/queria-io/dataset-cas
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 行政事業レビュー見える化サイト（行政改革推進本部事務局）
    path: https://rssystem.go.jp
  - title: 内閣官房ウェブサイト
    path: https://www.cas.go.jp/

contributors:
  - title: 内閣官房
    path: https://www.cas.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: plans
    title: 計画・通知等

annotations:
  queria:
    themes: [government_finance]
    cover: 🏛️
